<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">SEMADS</title>
  <desc id="desc">Logomarca SEMADS com símbolo geométrico colorido e texto branco.</desc>
  <defs>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07966f"/><stop offset="1" stop-color="#00664f"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1975e8"/><stop offset="1" stop-color="#0645a8"/></linearGradient>
    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#24c9f4"/><stop offset="1" stop-color="#069bd0"/></linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe72a"/><stop offset="1" stop-color="#f4c900"/></linearGradient>
    <linearGradient id="white" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e9eef0"/></linearGradient>
  </defs>
  <g filter="url(#shadow)">
    <rect x="515" y="35" width="170" height="100" rx="18" fill="url(#green)"/>
    <rect x="390" y="145" width="170" height="170" rx="20" fill="url(#white)"/>
    <rect x="575" y="145" width="170" height="170" rx="20" fill="url(#cyan)"/>
    <rect x="760" y="145" width="170" height="170" rx="20" fill="url(#blue)"/>
    <rect x="425" y="335" width="135" height="135" rx="18" fill="url(#blue)"/>
    <rect x="575" y="335" width="170" height="170" rx="20" fill="url(#green)"/>
    <rect x="760" y="335" width="135" height="135" rx="18" fill="url(#yellow)"/>
    <rect x="593" y="520" width="135" height="95" rx="18" fill="url(#white)"/>
  </g>
  <text x="600" y="635" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="150" font-weight="800" letter-spacing="2" fill="#ffffff">SEMADS</text>
</svg>